name: Face runtime artifact safety
on:
  pull_request:
    paths:
      - 'scripts/face-runtime/**'
      - '.github/workflows/face-runtime.yml'
  push:
    paths:
      - 'scripts/face-runtime/**'
      - '.github/workflows/face-runtime.yml'
permissions:
  contents: read
jobs:
  artifact-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Download and verify pinned encrypted-index wheels
        run: |
          python -m pip install --force-reinstall --require-hashes --only-binary=:all: -r scripts/face-runtime/requirements-index.lock
      - name: Test artifact integrity and resource bounds without model downloads
        run: python -m unittest discover -s scripts/face-runtime -p "test_*.py"
