# Inactive template. Replace example.invalid and certificate paths before installation.
# Keep port 3001 private in the host firewall/security group.
server {
    listen 80;
    server_name example.invalid;
    return 308 https://example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/picfind/current/apps/web/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 12m;
    client_body_timeout 30s;
    send_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_cache off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
